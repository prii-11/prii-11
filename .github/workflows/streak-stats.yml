name: GitHub Streak Stats
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: DenverCoder1/github-readme-streak-stats@master
        with:
          user_id: 194407850
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
